# ============================================================
# Sistema: Genérico (cualquier TTRPG no listado)
# ============================================================

sistema: "Sistema Genérico"
edition: "libre"
slug: "generic"

# --- Vocabulario ---
vocabulario:
  grupo_pc: "grupo de personajes"
  faccion_term: "organizacion"
  lider_term: "Líder"
  asistente_lider_term: "Segundo al mando"
  territorio_term: "territorio"
  personaje_term: "personaje"
  npc_agrupador: "tipo"
  mecanica_moral: "Valores"
  mecanica_central: "Habilidades"
  eje_horror: "consecuencias y dilemas morales"
  ritual_union: "Acuerdo de Grupo"
  corte_term: "Lugar de reunión"

# --- Campos custom NPC (mínimo universal) ---
npc_campos_extra:
  - nombre: "tipo"
    label: "Tipo de Personaje"
    tipo: "string"
  - nombre: "poder"
    label: "Nivel de Poder"
    tipo: "string"
  - nombre: "afiliacion"
    label: "Afiliación"
    tipo: "wikilink"

# --- Campos custom Facción ---
faccion_campos_extra:
  - nombre: "lider"
    label: "Líder"
    tipo: "wikilink"
  - nombre: "base"
    label: "Base"
    tipo: "wikilink"

# --- Pool de acciones de NPCs (para simulación entre sesiones) ---
npc_acciones:
  - "observar y esperar"
  - "reunirse con aliados"
  - "avanzar agenda propia"
  - "recolectar información"
  - "reclutar colaboradores"
  - "eliminar un obstáculo"
  - "negociar con un rival"
  - "preparar un plan"

# --- Amenazas externas ---
amenazas_externas:
  - "Facción antagonista"
  - "Amenaza sobrenatural"
  - "Autoridad represora"
  - "Catástrofe inminente"

# --- Prompt de sistema LLM ---
llm_system_prompt: |
  Eres un narrador de juego de rol de mesa.
  Tu tono se adapta al mundo que se te describe en el contexto.
  Reglas estrictas:
  - No inventés nombres, lugares ni facciones que no estén en el contexto.
  - No contradecís la información del vault que se te proporciona.
  - Respondé en español rioplatense.
  - Limitá la respuesta a 2-3 párrafos narrativos (máximo 250 palabras).
  - Si se te pide un menú de opciones, ofrecé exactamente 3, sin respuesta correcta.

# --- Tags Dataview ---
tags_por_tipo:
  npc: ["npc"]
  locacion: ["locacion"]
  frente: ["frente"]
  misterio: ["misterio"]
  faccion: ["faccion"]

# --- Planilla de personaje (schema dinámico para GUI) ---
character_sheet_schema:
  archetype_key: tipo
  base_sections:
    - name: "Identidad"
      fields:
        - {key: nombre,           label: Nombre,             type: string}
        - {key: tipo,             label: Tipo,               type: string}
        - {key: afiliacion,       label: Afiliación,         type: string}
        - {key: trasfondo,        label: Trasfondo,          type: string}
    - name: "Atributos"
      fields:
        - {key: atributo_1,       label: Atributo 1,         type: string}
        - {key: atributo_2,       label: Atributo 2,         type: string}
        - {key: atributo_3,       label: Atributo 3,         type: string}
    - name: "Estado"
      fields:
        - {key: hp,               label: Salud,              type: string}
        - {key: recurso,          label: Recurso principal,  type: string}
        - {key: habilidades,      label: Habilidades,        type: list}

lorebook: []

# --- Política de conocimiento ---
knowledge:
  brain_system: "generic"
  preferred_sources:
    - manual
    - system
    - universal
  universal_fallback: true

# --- Resolución mecánica (Rule Arbiter) ---
resolution:
  mecanica: "ratio"
  # Bandas PbtA-like por ratio del máximo posible de la tirada
  bandas: {exito: 0.8, parcial: 0.5}
