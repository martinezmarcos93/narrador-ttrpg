# ============================================================
# Sistema: Hombre Lobo: El Apocalipsis — W20 (20º aniversario)
# ============================================================

sistema: "Hombre Lobo: El Apocalipsis"
edition: "W20"
slug: "wta_w20"

# --- Vocabulario (lo que aparece en prompts y plantillas) ---
vocabulario:
  grupo_pc: "manada"
  faccion_term: "tribu"
  lider_term: "Alfa"
  asistente_lider_term: "Beta"
  territorio_term: "túmulo"
  personaje_term: "Garou"
  npc_agrupador: "tribu"
  mecanica_moral: "Renombre (Gloria, Honor, Sabiduría) y la Letanía"
  mecanica_central: "Dones, Furia y Gnosis"
  eje_horror: "la corrupción del Wyrm y la propia Furia"
  ritual_union: "Rito de Pasaje"
  corte_term: "asamblea"

# --- Campos custom para fichas de NPC ---
