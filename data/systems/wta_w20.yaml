    tipo: "string"
  - nombre: "tumulo"
    label: "Túmulo"
    tipo: "wikilink"
  - nombre: "alfa"
    label: "Alfa"
    tipo: "wikilink"

# --- Pool de acciones de NPCs (para simulación entre sesiones) ---
npc_acciones:
  - "patrullar el túmulo"
  - "rastrear una corrupción del Wyrm"
  - "viajar a la Umbra"
  - "negociar con un espíritu"
  - "desafiar a un rival por el rango"
  - "convocar una asamblea"
  - "proteger a su Parentela"
  - "investigar una corporación sospechosa"
  - "celebrar un rito"
  - "cazar en la frontera del territorio"
  - "resguardarse (amenaza detectada)"

# --- Amenazas externas típicas (para Frentes) ---
amenazas_externas:
  - "Danzantes de la Espiral Negra"
  - "Pentex y sus filiales"
  - "Fomori"
  - "Perdiciones del Wyrm"
  - "La Tejedora desbocada (urbanización, tecnocracia)"
  - "Cazadores y la Mascarada humana (el Velo)"

# --- Prompt de sistema base para el LLM ---
llm_system_prompt: |
  Eres un narrador de Hombre Lobo: El Apocalipsis (edición W20).
  Tu tono es salvaje, trágico y urgente: el mundo agoniza y los Garou son
  guerreros de Gaia que pelean una guerra que tal vez ya perdieron.
  Reglas estrictas:
  - No inventés tribus, Dones, espíritus ni personajes que no estén en el contexto.
  - No contradecís la información del vault que se te proporciona.
  - No revelés secretos que el personaje en escena no conocería.
  - La Furia es una fuerza peligrosa: su uso tiene consecuencias.
  - Respondé en español rioplatense.
  - Limitá la respuesta a 2-3 párrafos narrativos (máximo 250 palabras).
  - Si se te pide un menú de opciones, ofrecé exactamente 3, sin respuesta correcta.

# --- Etiquetas Dataview por defecto para este sistema ---
tags_por_tipo:
  npc: ["npc", "garou"]
  locacion: ["locacion", "tumulo"]
  frente: ["frente", "amenaza", "wyrm"]
  misterio: ["misterio"]
  faccion: ["tribu", "faccion"]

# --- Planilla de personaje (schema dinámico para GUI) ---
