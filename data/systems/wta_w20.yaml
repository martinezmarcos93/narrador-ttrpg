    label: "Tribu"
    tipo: "string"
  - nombre: "augurio"
    label: "Augurio"
    tipo: "string"
  - nombre: "raza"
    label: "Raza"
    tipo: "string"
  - nombre: "rango"
    label: "Rango"
    tipo: "integer"
