# --- Recuperación de conocimiento ---
knowledge:
  brain_system: "wta_w20"
  preferred_sources:
    - manual
    - system
    - universal
  universal_fallback: true

# --- Resolución mecánica (Rule Arbiter) ---
resolution:
  mecanica: "pool_d10"
  dificultades: {facil: 5, normal: 6, dificil: 8}
  dificultad_default: "normal"
  keywords_dificultad:
    facil: ["fácil", "facil", "sencillo", "trivial", "rutinario"]
    dificil: ["difícil", "dificil", "arriesgado", "complicado", "casi imposible", "extremo"]
  atributo_default: "destreza"
  acciones:
    - {keywords: ["ataco", "golpeo", "peleo", "embisto", "derribo", "muerdo", "desgarro", "pelear"], atributo: "fuerza", habilidad: "pelea", etiqueta: "Fuerza + Pelea"}
    - {keywords: ["olfateo", "rastreo", "sigo el rastro", "instinto"], atributo: "percepcion", habilidad: "instinto_primario", etiqueta: "Percepción + Instinto Primario"}
    - {keywords: ["cambio de forma", "me transformo", "adopto la forma"], atributo: "resistencia", habilidad: "instinto_primario", etiqueta: "Resistencia + Instinto Primario"}
    - {keywords: ["cuchillo", "espada", "machete", "estaca", "bate", "con mi arma"], atributo: "destreza", habilidad: "pelea_armas", etiqueta: "Destreza + Pelea con Armas"}
    - {keywords: ["disparo", "apunto", "disparar"], atributo: "destreza", habilidad: "armas_fuego", etiqueta: "Destreza + Armas de Fuego"}
    - {keywords: ["sigilo", "me escondo", "me oculto", "sin ser visto", "esconderme"], atributo: "destreza", habilidad: "sigilo", etiqueta: "Destreza + Sigilo"}
    - {keywords: ["esquivo", "trepo", "salto", "corro", "escalo", "huyo"], atributo: "destreza", habilidad: "atletismo", etiqueta: "Destreza + Atletismo"}
    - {keywords: ["robo", "abro la cerradura", "forzar la cerradura", "carterista"], atributo: "destreza", habilidad: "latrocinio", etiqueta: "Destreza + Latrocinio"}
    - {keywords: ["fuerzo", "levanto", "rompo", "derribo la puerta"], atributo: "fuerza", habilidad: "atletismo", etiqueta: "Fuerza + Atletismo"}
    - {keywords: ["resisto", "aguanto", "soporto"], atributo: "resistencia", etiqueta: "Resistencia"}
    - {keywords: ["persuado", "convenzo", "convencer", "seduzco", "inspiro"], atributo: "carisma", habilidad: "expresion", etiqueta: "Carisma + Expresión"}
    - {keywords: ["lidero", "ordeno", "arengo"], atributo: "carisma", habilidad: "liderazgo", etiqueta: "Carisma + Liderazgo"}
    - {keywords: ["intimido", "amenazo", "intimidar"], atributo: "manipulacion", habilidad: "intimidacion", etiqueta: "Manipulación + Intimidación"}
    - {keywords: ["engaño", "miento", "manipulo", "negocio", "engañar"], atributo: "manipulacion", habilidad: "subterfugio", etiqueta: "Manipulación + Subterfugio"}
    - {keywords: ["percibo", "observo", "escucho", "noto", "vigilo"], atributo: "percepcion", habilidad: "alerta", etiqueta: "Percepción + Alerta"}
    - {keywords: ["busco", "examino", "inspecciono", "registro"], atributo: "percepcion", habilidad: "investigacion", etiqueta: "Percepción + Investigación"}
    - {keywords: ["investigo", "analizo", "recuerdo", "descifro", "investigar"], atributo: "inteligencia", habilidad: "investigacion", etiqueta: "Inteligencia + Investigación"}
    - {keywords: ["rito", "ritual"], atributo: "inteligencia", habilidad: "rituales", etiqueta: "Inteligencia + Rituales"}
    - {keywords: ["espíritu", "espiritu", "umbra", "enigma"], atributo: "inteligencia", habilidad: "enigmas", etiqueta: "Inteligencia + Enigmas"}
    - {keywords: ["empatizo", "leo sus intenciones", "intuyo", "le creo"], atributo: "percepcion", habilidad: "empatia", etiqueta: "Percepción + Empatía"}
    - {keywords: ["reacciono", "improviso", "astucia"], atributo: "astucia", habilidad: "alerta", etiqueta: "Astucia + Alerta"}

# --- Lorebook: reglas puntuales indexadas por keyword (texto propio, no del manual) ---
lorebook:
  - keywords: ["letanía", "letania"]
    priority: 5
    content: >
      La Letanía es el código de leyes de los Garou. Violarla tiene
      consecuencias sociales concretas: pérdida de Renombre, castigos de la
      asamblea o incluso el exilio.
  - keywords: ["delirio", "velo", "crinos"]
    priority: 5
    content: >
      Los humanos que ven a un Garou en forma de guerra suelen sufrir el
      Delirio: pánico, negación y recuerdos borrosos. Eso protege el secreto,
      pero no impide que haya testigos con secuelas.
  - keywords: ["plata", "plateado", "arma de plata"]
    priority: 4
    content: >
      La plata es la debilidad de los Garou: sus heridas no se regeneran con
      facilidad. Un enemigo que la usa sabe a quién se enfrenta.
  - keywords: ["umbra", "penumbra", "cruzar el velo", "paso al otro lado"]
    priority: 4
    content: >
      La Umbra es el mundo espiritual. Entrar en ella permite tratar con
      espíritus, pero el reflejo umbral de un lugar delata su estado: un sitio
      corrompido por el Wyrm se ve enfermo del otro lado.
  - keywords: ["frenesí", "frenesi", "furia desatada"]
    priority: 5
    content: >
      Un Garou con mucha Furia corre el riesgo de entrar en frenesí ante el
      dolor o la provocación: ataca sin distinguir aliados, o huye. Es una
      consecuencia, no una herramienta a voluntad.

# Reglas de continuidad verificadas por Python antes de mutar el estado
# (ver narrator/core/system_rules.py).
continuity_rules:
  fact_ranges:
    furia: {min: 0, max: 10}
    gnosis: {min: 0, max: 10}
    fuerza_voluntad: {min: 0, max: 10}
    rango: {min: 0, max: 6}
  fact_values:
    forma: [hominido, glabro, crinos, hispo, lupus]
  mutually_exclusive:
    - [en_umbra, en_mundo_fisico]
    - [en_frenesi, inconsciente]

# Detección automática del sistema desde el texto del manual
# (ver narrator/core/system_detection.py).
deteccion:
  nombre_visible: "Mundo de Tinieblas (Hombre Lobo W20)"
  keywords: {hombre lobo: 3, hombres lobo: 3, garou: 3, werewolf: 3, wyrm: 3, gaia: 2, augurio: 2, crinos: 3, umbra: 2, tumulo: 2, letania: 2, fianna: 2, ahroun: 2, ragabash: 2, theurge: 2, philodox: 2, galliard: 2, apocalipsis: 1}
