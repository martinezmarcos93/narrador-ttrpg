character_sheet_schema:
  archetype_key: raza
  base_sections:
    - name: "Identidad"
      fields:
        - {key: nombre,           label: Nombre,             type: string}
        - {key: raza,             label: Raza,               type: string}
        - {key: augurio,          label: Augurio,            type: string}
        - {key: tribu,            label: Tribu,              type: string}
        - {key: manada,           label: Manada,             type: string}
        - {key: totem,            label: Tótem de manada,    type: string}
        - {key: naturaleza,       label: Naturaleza,         type: string}
        - {key: comportamiento,   label: Conducta,           type: string}
        - {key: concepto,         label: Concepto,           type: string}
        - {key: forma,            label: Forma actual,       type: string}
    - name: "Atributos"
