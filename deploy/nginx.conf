# Alternativa con nginx (certificados con certbot).
server {
    listen 443 ssl http2;
    server_name narrador.example.com;
    ssl_certificate     /etc/letsencrypt/live/narrador.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/narrador.example.com/privkey.pem;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE
        proxy_read_timeout 300s;      # turnos largos con modelos locales
    }
}
server {
    listen 80;
    server_name narrador.example.com;
    return 301 https://$host$request_uri;
}
